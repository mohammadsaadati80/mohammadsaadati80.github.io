# Site settings
locale                   : "en-US"
title                    : "Mohammad Saadati"
name                     : "Mohammad Saadati"
description              : "M.S. student in Artificial Intelligence at GIST · Gwangju, South Korea"
url                      : https://mohammadsaadati80.github.io
baseurl                  : ""
repository               : "mohammadsaadati80.github.io"

# Build settings
markdown                 : kramdown
encoding                 : "utf-8"

# Jekyll normally ignores folders that start with an underscore, so _pages
# (which holds the homepage) must be explicitly included. `files` holds the
# linked PDFs.
include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - .idea
  - .claude
  - vendor

# GitHub Pages supported plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
